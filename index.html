<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE FALCON'S KILL | SYSTEM OVERRIDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cyber-black': '#030508',
              'cyber-dark': '#0b101a',
              'tech-cyan': '#00f3ff',
              'tech-cyan-dim': 'rgba(0, 243, 255, 0.15)',
              'alert-red': '#ff2a2a',
              'alert-red-dim': 'rgba(255, 42, 42, 0.15)',
              'holo-white': 'rgba(255, 255, 255, 0.8)',
            },
            fontFamily: {
              'mono': ['"Share Tech Mono"', 'monospace'],
              'sans': ['"Inter"', 'sans-serif'],
              'display': ['"Rajdhani"', 'sans-serif'],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #1f2937 1px, transparent 1px), linear-gradient(to bottom, #1f2937 1px, transparent 1px)",
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'ping-slow': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glitch': 'glitch 0.4s cubic-bezier(.25, .46, .45, .94) both infinite',
              'slide-up': 'slideUp 0.5s ease-out forwards',
            },
            keyframes: {
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' }
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #030508;
        color: #e5e5e5;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b101a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #00f3ff; 
      }

      /* Tech Borders */
      .tech-border {
        position: relative;
        clip-path: polygon(
          0 0, 
          100% 0, 
          100% calc(100% - 15px), 
          calc(100% - 15px) 100%, 
          0 100%
        );
      }
      
      .tech-border-inverse {
         clip-path: polygon(
          0 15px, 
          15px 0, 
          100% 0, 
          100% 100%, 
          0 100%
        );
      }

      /* Grid Background */
      .bg-tech-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
